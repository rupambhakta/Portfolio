<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rupam Bhakta — AI Automation Engineer & Full-Stack Developer</title>
    <meta
      name="description"
      content="Rupam Bhakta builds AI agents, automations, and full-stack apps that save growing teams hours every week. Selected work, case studies, and services."
    />
    <meta name="theme-color" content="#131009" />
    <!-- Apply the saved theme before first paint so there is no flash. -->
    <script>
      (function () {
        var t = "ember";
        try {
          var s = localStorage.getItem("rb-theme");
          if (s === "ember" || s === "light" || s === "dark") t = s;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m)
          m.setAttribute(
            "content",
            t === "light" ? "#ffffff" : t === "dark" ? "#08080a" : "#131009",
          );
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-PHRSYPTKD2"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-PHRSYPTKD2");
    </script>
    <meta
      property="og:title"
      content="Rupam Bhakta — AI Automation Engineer & Full-Stack Developer"
    />

      content="I build AI systems that run the busywork — agents, automations, and full-stack apps."
