name: Publish scheduled blog

on:
  schedule:
    # 09:00 Asia/Kolkata every day.
    - cron: '0 9 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish one due post
        run: node scripts/publish-next-blog.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit and push publication
        shell: bash
        run: |
          if git diff --quiet -- src/data/blog-schedule.json public/sitemap.xml; then
            echo "No publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-schedule.json public/sitemap.xml
          git commit -m "chore: publish scheduled blog"
          git push
