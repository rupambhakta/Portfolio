<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251610"/><stop offset="1" stop-color="#3a2015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.5"/>
      <stop offset="0.62" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#efe9df" fill-opacity="0.055"/>
    </pattern>
    
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>
  <g fill="none" stroke="#FF7A45" stroke-width="2.5"><circle cx="1300" cy="410" r="110" stroke-opacity="0.50"/><circle cx="1300" cy="410" r="200" stroke-opacity="0.41"/><circle cx="1300" cy="410" r="300" stroke-opacity="0.32"/><circle cx="1300" cy="410" r="410" stroke-opacity="0.23"/><circle cx="1300" cy="410" r="530" stroke-opacity="0.14"/><circle cx="1300" cy="410" r="26" fill="#FF7A45" fill-opacity="0.6" stroke="none"/></g>
  <rect width="1600" height="800" filter="url(#g)" opacity="0.06"/>
</svg>