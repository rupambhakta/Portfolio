      <stop offset="0" stop-color="#122019"/><stop offset="1" stop-color="#1c3224"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#5FBF77" stop-opacity="0.5"/>
      <stop offset="0.62" stop-color="#5FBF77" stop-opacity="0"/>
