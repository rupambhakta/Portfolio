<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Control-led multi-agent workflow architecture</title>
  <desc id="desc">A request enters a coordinator, durable state and a queue feed five bounded specialist agents, then validation and synthesis lead to a human approval gate.</desc>
  <defs>
    <style>
      .bg{fill:#131009}.line{fill:none;stroke:#d6cfc1;stroke-width:3}.soft{fill:#d6cfc1}.muted{fill:#b3a996}.orange{fill:#ff5a1f}.cream{fill:#f4efe4}.box{fill:#1d1910;stroke:#d6cfc1;stroke-width:2}.accentbox{fill:#28150d;stroke:#ff5a1f;stroke-width:2}.label{font:600 18px 'Arial',sans-serif;letter-spacing:1px}.small{font:500 14px 'Arial',sans-serif;letter-spacing:1px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" class="orange"/></marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" class="soft"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" class="bg"/>
  <path d="M110 340H220" class="line" marker-end="url(#arrowSoft)"/>
  <circle cx="90" cy="340" r="22" class="orange"/><text x="48" y="390" class="small muted">REQUEST</text>
  <rect x="220" y="230" width="190" height="220" rx="18" class="box"/>
  <circle cx="315" cy="300" r="32" class="orange"/><path d="M300 300h30M315 285v30" class="line"/>
  <text x="263" y="370" class="label cream">ORCHESTRATOR</text><text x="259" y="400" class="small muted">ORDER + POLICY</text>
  <path d="M410 280H485M410 400H485" class="line" marker-end="url(#arrowSoft)"/>
  <rect x="485" y="190" width="170" height="100" rx="16" class="box"/><text x="513" y="235" class="label cream">DURABLE</text><text x="517" y="262" class="label cream">STATE</text>
  <rect x="485" y="390" width="170" height="100" rx="16" class="box"/><text x="524" y="435" class="label cream">QUEUE</text><text x="509" y="462" class="small muted">RETRY + DELAY</text>
  <path d="M655 240H735M655 440H735" class="line" marker-end="url(#arrowSoft)"/>
  <rect x="735" y="54" width="190" height="78" rx="14" class="box"/><text x="773" y="101" class="label cream">AUDIT</text>
  <rect x="735" y="154" width="190" height="78" rx="14" class="box"/><text x="758" y="201" class="label cream">KEYWORDS</text>
  <rect x="735" y="254" width="190" height="78" rx="14" class="box"/><text x="764" y="301" class="label cream">COMPETITORS</text>
  <rect x="735" y="354" width="190" height="78" rx="14" class="box"/><text x="773" y="401" class="label cream">WRITING</text>
  <rect x="735" y="454" width="190" height="78" rx="14" class="box"/><text x="774" y="501" class="label cream">PLANNING</text>
  <path d="M830 132V154M830 232V254M830 332V354M830 432V454" class="line" marker-end="url(#arrowSoft)"/>
  <path d="M925 293H1010" class="line" marker-end="url(#arrow)"/>
  <rect x="1010" y="232" width="145" height="122" rx="16" class="accentbox"/><text x="1036" y="275" class="label cream">VALIDATE</text><text x="1030" y="304" class="small muted">SCHEMA +</text><text x="1030" y="326" class="small muted">EVIDENCE</text>
  <path d="M1082 354V420H1010" class="line" marker-end="url(#arrowSoft)"/>
  <rect x="1010" y="420" width="145" height="90" rx="16" class="box"/><text x="1034" y="473" class="label cream">SYNTHESIS</text>
  <path d="M1082 510V585" class="line" marker-end="url(#arrow)"/>
  <path d="M1082 585H900" class="line" marker-end="url(#arrow)"/>
  <circle cx="850" cy="585" r="38" class="accentbox"/><path d="M833 585l12 12 24-28" class="line"/><text x="773" y="640" class="small muted">HUMAN GATE</text>
  <path d="M735 93H690V570H850" class="line" stroke-dasharray="8 8" marker-end="url(#arrowSoft)"/>
</svg>
